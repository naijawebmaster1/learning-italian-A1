<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Mastery Hub — Italiano A1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6ef;
    --ink: #1a1208;
    --terracotta: #c0492b;
    --gold: #d4a843;
    --border: #e0d5c5;
    --card: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .hub-container {
    max-width: 900px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    margin-bottom: 12px;
  }
  h1 em { color: var(--terracotta); font-style: italic; }
  .subtitle {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 60px;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    text-decoration: none;
    color: inherit;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 6px;
    background: var(--gold);
    transition: transform 0.3s;
    transform: scaleX(0);
  }
  .card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    border-color: var(--gold);
  }
  .card:hover::before {
    transform: scaleX(1);
  }
  .card-icon {
    font-size: 3rem;
    margin-bottom: 24px;
  }
  .card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    margin-bottom: 12px;
  }
  .card p {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .card .tag {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: var(--cream);
    padding: 6px 12px;
    border-radius: 12px;
    color: var(--terracotta);
  }
  .back-btn {
    margin-top: 60px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .back-btn:hover { opacity: 1; }
</style>
</head>
<body>

<div class="hub-container">
  <h1>Article <em>Mastery</em></h1>
  <p class="subtitle">Italian A1 Grammar Series</p>

  <div class="grid">
    <a href="articolo_determinativo.html" class="card">
      <div class="card-icon">📚</div>
      <h2>Definite Articles</h2>
      <p>Master <em>il, lo, la, i, gli, le</em> and their specific usage rules.</p>
      <span class="tag">7 Forms · Interactive</span>
    </a>

    <a href="articolo_indeterminativo.html" class="card">
      <div class="card-icon">✨</div>
      <h2>Indefinite Articles</h2>
      <p>Learn when to use <em>un, uno, una, un'</em> and avoid common pitfalls.</p>
      <span class="tag">Singular Only · Interactive</span>
    </a>
  </div>

  <a href="/" class="back-btn">
    <span>←</span> Torna alla Home
  </a>
</div>

</body>
</html>
